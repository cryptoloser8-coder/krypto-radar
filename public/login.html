<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Krypto Radar – logowanie</title>
<style>
  :root { --fog: #edf0f3; --surface: #ffffff; --ink: #17222e; --muted: #5c6b7a; --line: #d5dbe2; --crit: #c2283b; --focus: #4a3acf;
    --ui: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif; --fig: "Avenir Next Condensed", "Avenir Next", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --fog: #131b24; --surface: #1b2531; --ink: #e7ecf1; --muted: #93a1b0; --line: #2e3b49; --crit: #f0647a; --focus: #8f83f5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fog); color: var(--ink); font: 15px/1.45 var(--ui); padding: 16px; }
  form { background: var(--surface); border-radius: 10px; padding: 26px 24px 22px; width: 100%; max-width: 340px; }
  h1 { font: 600 28px/1 var(--fig); margin: 0 0 18px; }
  label { display: block; color: var(--muted); margin-bottom: 6px; }
  input { font: inherit; color: inherit; width: 100%; background: var(--fog); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 14px; }
  button { font: inherit; font-weight: 600; width: 100%; background: var(--ink); color: var(--surface); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .msg { color: var(--crit); margin: 0 0 12px; font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Krypto Radar</h1>
  {{MSG}}
  <label for="password">Hasło</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <button type="submit">Zaloguj</button>
</form>
</body>
</html>
